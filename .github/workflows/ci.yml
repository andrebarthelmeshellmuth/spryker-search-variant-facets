name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: composer validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer validate --no-check-publish

  style:
    name: phpcs (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpcs

  rector:
    # Dry run only, never writes to the working tree — guards against regressions on rules already
    # vetted for this codebase (see rector.php's own comments for what's skipped and why).
    name: rector (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          # opcache.enable_cli must be off: when on, Rector's BetterReflection-based autoloading
          # silently fails to parse EVERY file in this project (confirmed empirically on the sibling
          # search-debug/search-ranking packages) instead of erroring cleanly.
          ini-values: opcache.enable_cli=0
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer rector-dry-run

  floors:
    # The check that matters most for this package. Its dependency floors are claims about which
    # Spryker versions an adopter may install; a shop leaner than the development shop is exactly
    # where an undeclared dependency surfaces, and that cannot be observed while developing inside a
    # full demo shop. This resolves every constraint to its oldest allowed version and asserts each
    # vendor symbol used in src/ actually exists there.
    name: dependency floors (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer check-floors

  complexity:
    # Two SEPARATE phpmd runs, not one combined ruleset: PHPMD merges every loaded ruleset's
    # exclude-pattern into one global file-ignore list for a single invocation, so keeping
    # TooManyPublicMethods' Facade/Factory exemption in its own ruleset (run on its own) is the only
    # way to exempt just that one rule without also hiding Facades/Factories from the rules below.
    name: phpmd (codesize)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpmd src github phpmd.xml
      - name: Public method count (Facades/Factories exempt)
        run: vendor/bin/phpmd src github phpmd-public-methods.xml

  host-shop:
    # phpstan and this package's own Codeception suites both need a real Spryker host shop: their
    # DependencyProviders/Testers resolve against the shop's GENERATED Locator and
    # Generated\Shared\Transfer\* classes, neither of which a standalone package's own composer.json can
    # produce (see phpstan.neon's own bootstrapFiles comment and the README's "Testing and CI" section).
    # Combined into ONE job (phpstan, then Client+Zed suites) rather than two, so the shop is only
    # installed once — that install step dominates this job's runtime.
    #
    # Uses the public spryker-shop/b2b-demo-marketplace as that host shop, wired to this checkout via a
    # composer path-repository — the same install shape this package's own README documents for a real
    # adopter, just automated. `transfer:generate` and `dev:ide-auto-completion:generate` are pure
    # static codegen over the installed package set (confirmed empirically: both run clean with no
    # DB/Redis/Elasticsearch service present) — no docker-compose stack needed for phpstan or these two
    # suites. The WebDriver Presentation suite is deliberately NOT run here: it needs a live
    # OpenSearch-backed catalog with this package's own fixture applied plus a real browser session,
    # which does need that full stack — out of scope for a plain GitHub Actions runner without
    # self-hosted infra. That suite stays a local/manual gate (see the README).
    name: phpstan + Codeception (host shop)
    runs-on: ubuntu-latest
    env:
      # Required just to boot the console app / Config bootstrap at all (confirmed empirically:
      # "Environment variable APPLICATION_ENV must be set" otherwise) — "development" is the standard
      # lenient Spryker environment; nothing this job runs actually reads environment-specific config.
      APPLICATION_ENV: development
      # config_default.php gates `dev:*` console commands (incl. dev:ide-auto-completion:generate)
      # behind ConsoleConstants::ENABLE_DEVELOPMENT_CONSOLE_COMMANDS, which reads this exact env var —
      # confirmed empirically ("There are no commands defined in the dev:ide-auto-completion namespace"
      # without it).
      DEVELOPMENT_CONSOLE_COMMANDS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: spryker-shop/b2b-demo-marketplace
          path: shop

      # Nested INSIDE shop/, at the exact relative path this package's own dev environment uses
      # (packages/spryker-community/<name>) — phpstan.neon/codeception.yml paths and console command
      # invocations below all assume that layout, matching how a real adopter installs this package.
      - uses: actions/checkout@v4
        with:
          path: shop/packages/spryker-community/search-variant-facets

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          # grpc: spryker/opentelemetry (a transitive dependency of this demo shop, unrelated to this
          # package) requires open-telemetry/transport-grpc, which requires ext-grpc to even resolve via
          # composer — confirmed empirically (composer require fails at the dependency-resolution step,
          # before install, without this). Not actually exercised by transfer:generate/phpstan/codecept.
          extensions: grpc

      - name: Wire this checkout into the shop as a path repository
        working-directory: shop
        run: |
          composer config repositories.search-variant-facets path packages/spryker-community/search-variant-facets
          composer require spryker-community/search-variant-facets:@dev --no-interaction --no-progress -W

      - name: Generate transfers and IDE auto-completion stubs
        working-directory: shop
        run: |
          vendor/bin/console transfer:generate
          vendor/bin/console dev:ide-auto-completion:generate
          # Generated\Shared\Search\PageIndexMap (this package's own MatchingVariantResultFormatterPlugin
          # references PageIndexMap::SEARCH_RESULT_DATA) comes from a SEPARATE generator than
          # transfer:generate — confirmed empirically ("Access to constant ... on an unknown class"
          # without this). Also pure schema-file codegen, no DB/ES needed.
          vendor/bin/console search:setup:source-map

      - name: phpstan
        working-directory: shop
        run: vendor/bin/phpstan analyse -c packages/spryker-community/search-variant-facets/phpstan.neon packages/spryker-community/search-variant-facets/src/

      - name: Codeception build
        working-directory: shop
        run: |
          vendor/bin/codecept build -c packages/spryker-community/search-variant-facets/tests/SprykerCommunityTest/Client/VariantFacets/codeception.yml
          vendor/bin/codecept build -c packages/spryker-community/search-variant-facets/tests/SprykerCommunityTest/Zed/VariantFacets/codeception.yml

      - name: Codeception run (Client + Zed — unit-level, no DB/ES fixtures needed)
        working-directory: shop
        run: |
          vendor/bin/codecept run -c packages/spryker-community/search-variant-facets/tests/SprykerCommunityTest/Client/VariantFacets/codeception.yml
          vendor/bin/codecept run -c packages/spryker-community/search-variant-facets/tests/SprykerCommunityTest/Zed/VariantFacets/codeception.yml
